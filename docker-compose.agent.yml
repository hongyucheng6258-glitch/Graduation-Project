name: ai-campus-docker

services:
  mysql:
    environment:
      TZ: ${CAMPUS_TIMEZONE:-Asia/Shanghai}
    volumes:
      - ./docker/mysql/99-no-demo.sql:/docker-entrypoint-initdb.d/99-testdata.sql:ro

  agent-migrate:
    image: mysql:8.0
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DB:-ai_campus_platform}
    volumes:
      - ./web/backend/src/main/resources/db/2026-11-09-agent-knowledge.sql:/migrations/01-knowledge.sql:ro
      - ./web/backend/src/main/resources/db/2026-11-09-agent-prompt.sql:/migrations/02-prompt.sql:ro
      - ./web/backend/src/main/resources/db/2026-11-09-agent-action.sql:/migrations/03-action.sql:ro
      - ./web/backend/src/main/resources/db/2026-11-09-agent-idle-draft.sql:/migrations/04-idle-draft.sql:ro
      - ./web/backend/src/main/resources/db/2026-11-09-agent-idle-appointment.sql:/migrations/05-idle-appointment.sql:ro
      - ./web/backend/src/main/resources/db/2026-11-09-admin-assistant.sql:/migrations/06-admin-assistant.sql:ro
      - ./web/backend/src/main/resources/db/2026-11-09-admin-assistant-review.sql:/migrations/07-admin-assistant-review.sql:ro
      - ./web/backend/src/main/resources/db/2026-11-09-admin-assistant-notice.sql:/migrations/08-admin-assistant-notice.sql:ro
      - ./web/backend/src/main/resources/db/2026-11-09-idle-audit-revision.sql:/migrations/09-idle-audit-revision.sql:ro
    command:
      - /bin/sh
      - -ec
      - |
        for migration in /migrations/*.sql; do
          mysql -h mysql -uroot --default-character-set=utf8mb4 "$$MYSQL_DATABASE" < "$$migration"
        done

  backend:
    environment:
      TZ: ${CAMPUS_TIMEZONE:-Asia/Shanghai}
      PLATFORM_CAPTCHA_ENABLED: "${CAMPUS_DOCKER_CAPTCHA_ENABLED:-true}"
      CAMPUS_AGENT_ENABLED: "${CAMPUS_AGENT_ENABLED:-true}"
      CAMPUS_ADMIN_ASSISTANT_ENABLED: "${CAMPUS_ADMIN_ASSISTANT_ENABLED:-true}"
      CAMPUS_AGENT_RAG_ENABLED: "${CAMPUS_AGENT_RAG_ENABLED:-true}"
      CAMPUS_AGENT_RAG_QDRANT_URL: http://qdrant:6333
      CAMPUS_AGENT_RAG_EMBEDDING_URL: http://embedding:11434
      CAMPUS_AGENT_RAG_EMBEDDING_MODEL: bge-small-zh-v1.5-onnx
      CAMPUS_AGENT_RAG_COLLECTION: campus_bge_small_onnx_v1
      CAMPUS_AGENT_RAG_CHUNK_CHARS: "400"
      CAMPUS_AGENT_RAG_QUERY_CHARS: "400"
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
    ports: !override
      - "${CAMPUS_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-18080}:8080"

  student:
    ports: !override
      - "${CAMPUS_BIND_ADDRESS:-127.0.0.1}:${STUDENT_PORT:-15173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 10s
      timeout: 4s
      retries: 10

  admin:
    ports: !override
      - "${CAMPUS_BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-15174}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/admin/"]
      interval: 10s
      timeout: 4s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - agent_vectors:/qdrant/storage
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/6333
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r line <&3
          [[ "$$line" == *" 200 "* ]]
      interval: 10s
      timeout: 4s
      retries: 10

  embedding:
    build:
      context: .
      dockerfile: docker/Dockerfile.embedding
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11434/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  agent_vectors:
