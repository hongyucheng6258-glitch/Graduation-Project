worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

stream {
    proxy_connect_timeout 5s;
    proxy_timeout 2h;

    server {
        listen 8080;
        proxy_pass host.docker.internal:${IDEA_BACKEND_PORT};
    }
    server {
        listen 3306;
        # 数据库连接池的空闲连接不能被 2h 的全局超时掐断
        proxy_timeout 12h;
        proxy_pass mysql:3306;
    }
    server {
        listen 6379;
        proxy_timeout 12h;
        proxy_pass redis:6379;
    }
    server {
        listen 6333;
        proxy_pass qdrant:6333;
    }
    server {
        listen 11434;
        proxy_pass embedding:11434;
    }
}
